<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4c51bf",
              secondary: "#667eea",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 p-3">
    <div
      class="bg-white/95 backdrop-blur-lg rounded-xl shadow-2xl border border-white/20 w-full max-w-7xl mx-auto p-4"
    >
      <!-- Header -->
      <div class="text-center mb-4">
        <h1 class="text-xl font-bold text-primary mb-1">
          ⚙️ Shatayu Sync Admin Panel
        </h1>
        <p class="text-xs text-gray-600">System Configuration & Management</p>
      </div>

      <!-- Authentication Section -->
      <div class="auth-section" id="authSection">
        <div class="max-w-md mx-auto">
          <div class="text-center mb-4">
            <h2 class="text-lg font-bold text-primary mb-2">
              🔐 Admin Access Required
            </h2>
            <p class="text-xs text-gray-600">
              Enter your credentials to access the configuration panel
            </p>
          </div>

          <form id="authForm" class="space-y-3">
            <div>
              <label
                for="password"
                class="block text-xs font-semibold text-gray-700 mb-1"
              >
                Admin Password
              </label>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 bg-white/80 text-sm"
              />
              <div
                id="authError"
                class="hidden mt-1 p-2 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded"
              ></div>
            </div>

            <button
              type="submit"
              class="w-full bg-gradient-to-r from-primary to-secondary text-white font-semibold py-2 px-4 rounded-lg hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 text-sm"
            >
              Authenticate
            </button>
          </form>
        </div>
      </div>

      <!-- Configuration Section -->
      <div class="config-section hidden" id="configSection">
        <!-- Tab Navigation -->
        <div class="flex mb-4 border-b border-gray-200">
          <button
            id="systemConfigTab"
            class="tab-button px-6 py-2 text-sm font-medium text-primary border-b-2 border-primary bg-blue-50"
          >
            🔧 System Configuration
          </button>
          <button
            id="deviceConfigTab"
            class="tab-button px-6 py-2 text-sm font-medium text-gray-600 border-b-2 border-transparent hover:text-primary hover:border-gray-300"
          >
            📹 Device Configuration
          </button>
        </div>

        <!-- Dynamic Tab Content Container -->
        <div id="tabContentContainer" class="tab-content-container">
          <!-- Tab content will be loaded dynamically here -->
          <div class="text-center p-8">
            <div
              class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mx-auto mb-2"
            ></div>
            <p class="text-gray-600 text-sm">Loading configuration...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Include JavaScript Modules -->
    <script src="../js/system-config.js"></script>
    <script src="../js/device-config.js"></script>
    <script src="../js/admin-config.js"></script>
  </body>
</html>
